# How-to-book data per program. Keys are the same codes as programs.yaml. Loaded by flypoints.booking.
# Rule: "unknown" / null means NOT verified from a source. Never fill a field from memory.
#
# Per-program fields:
#   alliance:          star | oneworld | skyteam | none  (the program's airline's alliance; used for "alternatives")
#   award_search_url:  the program's award search / booking page. Where only the airline's site root is given,
#                      no deeper official page was confirmed.
#   deep_link:         URL template with {origin} {destination} {date} {cabin} ({cabin} = Y/W/J/F), or null.
#                      Only set when a documented/evidenced URL format was found; none were as of 2026-10-20.
#   deep_link_verified: true only if the format was confirmed from a reliable source.
#   partner_booking:   online | phone | mixed | unknown  (can partner-airline awards be booked online?)
#   phone:             US-reachable award/reservations number from the airline's own site, else null.
#   holds:             award hold policy in a short sentence, or "unknown".
#   transfer_time:     per bank (chase, capital_one): "instant", "up to N hours", "N-M days", or "unknown".
#                      Issuer pages do not publish times; values come from points blogs and reader reports
#                      (typical, not guaranteed).
#   gotchas:           1-3 short, source-backed, actionable lines.
#   sources:           URLs used. verified: date checked.
#
# carriers: operating-carrier IATA code -> alliance (star | oneworld | skyteam | none).
# Membership changes: Asiana (OZ) leaves Star Alliance 2026-12-16 (absorbed by Korean Air); TAP (TP) alliance may
# change depending on its privatisation outcome (Lufthansa keeps it in Star; Air France-KLM may move it to SkyTeam).
# Review this map whenever alliances change.

