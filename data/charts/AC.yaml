# Aeroplan partner (Star Alliance etc.) award chart, one-way saver, distance-based per zone pair.
# Applies to partner-operated flights only; Air Canada metal is dynamically priced and NOT covered.
# Prices reflect the June 1, 2026 change.
program: AC
source:
  - https://awardtravelfinder.com/award-charts/aeroplan            # full table, read 2026-10-19
  - https://princeoftravel.com/news/aeroplan-flight-reward-chart-june-2026/   # after-June-2026 figures for 5 zone pairs; matches
verified: 2026-10-19
basis: distance
distance_unit: miles
# Rough author estimate, NOT sourced: partner awards usually carry ~USD 50-150 in taxes, but
# Lufthansa Group / some others pass through carrier surcharges that can add USD 200-600.
taxes_usd_typical: 150
# Caveats:
# - Zone membership: sources say North America zone includes Central America, Atlantic = Europe, Africa,
#   Middle East, India (OMAAT); Pacific = Asia, South Pacific. Aeroplan's zone map is an image; the Caribbean,
#   Mexico and Panama placement below (North America) is NOT confirmed by any source read.
# - Distance is Aeroplan's own mileage; we use great-circle statute miles, so routes within ~1% of a
#   band edge (e.g. SJU-MAD ~3,950 vs the 4,000 edge) may be priced in the wrong band.
# - Partner chart prices are fixed, but real award space is limited and carrier surcharges are extra.
zones:
  NA: [US, CA, MX, PR, GT, BZ, SV, HN, NI, CR, PA, CU, DO, JM, BS, BB, TT, AW, CW, KY, HT]
  SA: [AR, BO, BR, CL, CO, EC, GY, PY, PE, SR, UY, VE]
  ATL: [ES, PT, FR, NL, DE, CH, GB, IE, IT, GR, TR, AT, BE, DK, SE, NO, FI, IS, PL, CZ, HU, RO, BG, HR, RS,
        MT, LU, EE, LV, LT, SK, SI, CY, AE, QA, SA, BH, OM, KW, JO, LB, IL, EG, MA, DZ, TN, ZA, KE, NG, GH,
        ET, IN]
  PAC: [JP, KR, TW, HK, CN, SG, TH, VN, MY, ID, PH, AU, NZ, FJ]
