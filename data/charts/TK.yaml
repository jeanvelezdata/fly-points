# Turkish Miles&Smiles award chart for Star Alliance partner-operated flights, one-way, zone-based.
# Not the chart for Turkish Airlines metal. No premium economy; first often phone-only.
program: TK
source:
  - https://awardfares.com/blog/miles-and-smiles-guide    # full matrix, "checked against Turkish's official tables 2026-07-14"
  - https://meilenoptimieren.com/turkish-airlines-miles-and-smiles-awardchart/   # Europe 2 row (Aug 2026 chart) matches
verified: 2026-10-19
basis: zone
# Rough author estimate, NOT sourced: carrier surcharges vary by operating airline (Lufthansa Group high).
taxes_usd_typical: 150
# Caveats:
# - Cross-border within North America is 30k/40k/50k; same-country partner awards use `domestic`
#   (15k/22.5k/30k after the 2025-12-03 increase; the region matrix itself did not change).
# - Zone membership: US, CA, MX, GL per awardfares. meilenoptimieren says "South America" includes
#   Central America and much of the Caribbean, and South Asia (IN, BD, NP, PK) is "Central Asia", LK/MV are
#   "Far East"; neither source lists which Caribbean countries. Puerto Rico is ASSUMED to be North America
#   (US territory) - unverified; if wrong, PR routes are priced under South America.
# - Hawaii has a separate chart (25k/40k/50k), not modelled.
