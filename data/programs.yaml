# Keys are PointsYeah 2-letter program codes.
# ratio "a:b" = a bank points -> b partner miles (partner miles per bank point = b/a).
# verified: date the row was checked against the issuer's transfer-partner page.
banks:
  chase:
    min_transfer: 1000
    increment: 1000
    portal_cpp: 1.0   # Points Boost varies by card/booking; verify
  capital_one:
    min_transfer: 1000
    increment: 100    # PointsYeah showed 51,310 miles -> 51,400 points
    portal_cpp: 1.0

